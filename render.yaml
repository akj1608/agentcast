services:
  - type: web
    name: agentcast
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agentcast-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        value: https://www.agentcast.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: agentcast-db
    plan: free
    region: oregon
